[project]
name = "places-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "places-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "msal>=1.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/places_backend"]

[project.scripts]
places-backend = "places_backend.main:run"
