[project]
name = "places-booking"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
places-core    = { workspace = true }
places-backend = { workspace = true }
places-agent   = { workspace = true }
places-ui-user = { workspace = true }
places-ui-admin = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "places-core",
    "places-backend",
    "places-agent",
    "places-ui-admin",
    "places-ui-user",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
