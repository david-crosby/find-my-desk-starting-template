[project]
name = "places-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "places-core",
    "anthropic>=0.40",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/places_agent"]

[project.scripts]
places-agent = "places_agent.server:run"
