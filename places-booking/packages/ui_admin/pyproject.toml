[project]
name = "places-ui-admin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "places-core",
    "streamlit>=1.35",
    "httpx>=0.27",
    "plotly>=5.20",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/places_ui_admin"]
