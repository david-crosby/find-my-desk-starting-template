[project]
name = "places-ui-user"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "places-core",
    "streamlit>=1.35",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/places_ui_user"]
